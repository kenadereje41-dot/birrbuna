<style>
  :root{
    --bg:#071B17; --card:#111827; --line:#1f2a37; --input:#0b1220;
    --accent:#10B981; --accent2:#34d399; --gold:#FACC15; --text:#FFFFFF; --muted:#9ca3af; --ok:#10B981; --warn:#FACC15;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Ethiopic",sans-serif;
    background:radial-gradient(120% 60% at 50% 0%,#0d3a2f 0%,var(--bg) 60%);color:var(--text);min-height:100vh;padding-bottom:96px}
  header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px}
  .logo{font-size:24px;font-weight:800;letter-spacing:.5px;color:var(--text)}.logo b{color:var(--accent)}
  .langwrap{position:relative}
  .langbtn{width:auto;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:600}
  .langbtn svg{width:18px;height:18px}
  .langmenu{display:none;position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:10;min-width:170px;box-shadow:0 10px 30px #0008}
  .langmenu.open{display:block}
  .langmenu button{background:transparent;text-align:left;font-weight:500;padding:10px 12px;border-radius:10px}
  .langmenu button.sel{background:rgba(16,185,129,.18);color:var(--accent2)}
    main{padding:0 16px}
  .page{display:none}.page.active{display:block}
  .page.in-r{animation:inR .38s cubic-bezier(.22,.8,.3,1)}
  .page.in-l{animation:inL .38s cubic-bezier(.22,.8,.3,1)}
  @keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
  @keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
  nav a{transition:background .3s ease,color .3s ease,transform .2s ease}
  nav a:active{transform:scale(.94)}
  button{transition:transform .15s ease,filter .2s ease}
  button:active{transform:scale(.97)}
  #modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(3,10,8,.0);backdrop-filter:blur(0);pointer-events:none;transition:background .35s ease,backdrop-filter .35s ease}
  #modal.open{background:rgba(3,10,8,.72);backdrop-filter:blur(6px);pointer-events:auto}
  #modalBox{position:relative;overflow:hidden;width:100%;max-width:380px;background:linear-gradient(160deg,#0f2a22,#111827);
    border:1px solid rgba(16,185,129,.4);border-radius:26px;padding:28px 22px 22px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(16,185,129,.2);opacity:0;transform:translateY(30px) scale(.92);
    transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.3,.4,1)}
  #modal.open #modalBox{opacity:1;transform:none}
  #modalBox h3{font-size:22px;margin:14px 0 8px}
  #modalBox p{color:#d1fae5;font-size:14px;line-height:1.55;margin-bottom:18px}
  .mk{width:104px;height:104px}
  .mk-c{fill:rgba(16,185,129,.12);stroke:#10B981;stroke-width:6;stroke-dasharray:330;stroke-dashoffset:330}
  .mk-p{fill:none;stroke:#FACC15;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:90;stroke-dashoffset:90}
  #modal.open .mk-c{animation:draw .7s .15s ease forwards}
  #modal.open .mk-p{animation:draw .45s .75s ease forwards}
  #modal.open .mk{animation:pop .5s .7s ease}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pop{50%{transform:scale(1.12)}}
  .mk-inv{width:90px;height:90px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:42px;
    background:rgba(250,204,21,.12);border:3px solid var(--gold)}
  #modal.open .mk-inv{animation:pop .5s .2s ease}
  .coin-f{position:absolute;top:-30px;font-size:18px;opacity:0;pointer-events:none}
  #modal.open .coin-f{animation-name:fall;animation-timing-function:ease-in;animation-fill-mode:forwards}
  @keyframes fall{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translateY(420px) rotate(320deg)}}
  h2{font-size:24px;margin:8px 0 6px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .hero{background:linear-gradient(135deg,#0a6b4e,#10B981);border-radius:24px;padding:26px;text-align:center;
    box-shadow:0 10px 40px rgba(16,185,129,.35);margin-bottom:22px}
  .hero .lbl{opacity:.85;font-size:14px}
  .hero .big{font-size:52px;font-weight:800;margin:6px 0}
  .hero .big .coin{color:var(--gold)}
  .hero .big small{font-size:20px;font-weight:500;opacity:.8}
  .hero .meta{opacity:.8;font-size:14px}
  .chrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .chrow:last-child{border:0}
  .chrow img{width:44px;height:44px;border-radius:50%;flex:none}
  .chrow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chrow small{color:var(--gold);font-weight:700;font-size:12px}
  .chbtn{width:auto;padding:9px 16px;font-size:13px}
  .tokrow{display:flex;align-items:center;gap:12px;margin:16px auto 0;padding:10px 14px;max-width:320px;
    background:rgba(7,27,23,.38);border:1px solid rgba(250,204,21,.45);border-radius:18px}
  .tok{width:44px;height:44px;flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
  #tokBal{font-size:24px;color:var(--gold)}
  .tokname{font-weight:700;font-size:14px}
  .toksoon{font-size:11px;color:#d1fae5;margin-top:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .task{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .task .t{font-weight:700;font-size:15px}
  .task .r{color:var(--gold);font-size:13px;font-weight:700}
  .task.done{opacity:.55}
  button{font:inherit;border:0;border-radius:14px;padding:12px;font-weight:700;color:#fff;background:var(--accent);width:100%;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line)}
  button:disabled{background:#1f2a37;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
  .link{background:var(--input);border-radius:12px;padding:12px;word-break:break-all;font-size:14px;margin:10px 0}
  .row{display:flex;gap:10px}
  .stat{display:flex;justify-content:space-between;align-items:center}
  .stat b{font-size:26px}
  .lb{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .lb:last-child{border:0}
  .av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#071B17;display:flex;align-items:center;justify-content:center;font-weight:700}
  .lb .n{flex:1}.lb .v{color:var(--gold);font-weight:700}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
  input{width:100%;background:var(--input);border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;font-size:16px}
  .methods{display:flex;gap:8px;flex-wrap:wrap}
  .methods button{width:auto;flex:1;background:var(--input);border:1px solid var(--line)}
  .methods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .methods button.mth{display:flex;align-items:center;gap:10px;text-align:left;padding:10px;font-weight:600}
  .methods button.mth.sel{background:rgba(16,185,129,.15);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .mbadge{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;letter-spacing:-.3px}
  .methods img{flex:none;width:40px;height:40px;border-radius:50%;object-fit:contain;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .mwarn{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.5);color:var(--gold);font-size:13px;font-weight:600}
  .mtxt{min-width:0}.mtxt b{display:block;font-size:13px}.mtxt small{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .note{background:rgba(16,185,129,.12);border:1px solid var(--line);border-radius:14px;padding:12px;color:var(--accent2);font-weight:600;margin-bottom:14px}
  .hist{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
  .badge{font-size:12px;padding:3px 8px;border-radius:8px;background:rgba(250,204,21,.15);color:var(--gold)}
  .badge.paid{background:rgba(16,185,129,.18);color:var(--ok)}
  .empty{color:var(--muted);text-align:center;padding:20px 0}
  nav{position:fixed;left:12px;right:12px;bottom:12px;z-index:100;max-width:476px;margin:0 auto;box-shadow:0 -6px 24px rgba(0,0,0,.45);background:var(--card);border:1px solid var(--line);border-radius:22px;
    display:flex;padding:6px;gap:4px}
  nav a{flex:1;text-align:center;color:var(--muted);text-decoration:none;font-size:11px;padding:8px 2px;border-radius:16px}
  nav a .ic{font-size:20px;display:block;margin-bottom:2px}
  nav a.active{background:var(--accent);color:#071B17;font-weight:700}
  .promo{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,#14b884 0%,#0a7a58 45%,#064e3b 100%);
    border-radius:26px;padding:20px;margin-bottom:22px;border:1px solid rgba(250,204,21,.35);box-shadow:0 14px 44px rgba(16,185,129,.35)}
  .promo::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(250,204,21,.35),transparent 70%);pointer-events:none}
  .pbadge{display:inline-block;background:rgba(7,27,23,.5);border:1px solid rgba(250,204,21,.5);color:var(--gold);
    font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;letter-spacing:.3px}
  .phero{display:flex;align-items:center;gap:8px;margin-top:10px}
  .ptext{flex:1;position:relative;z-index:1}
  .pbig{font-size:30px;font-weight:900;line-height:1.05;margin-top:4px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25)}
  .pphone{width:120px;height:150px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45));position:relative;z-index:1;transform:rotate(8deg)}
  .pmini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .pmini div{background:rgba(7,27,23,.45);border-radius:14px;padding:8px 6px;text-align:center}
  .pmini img{width:100%;height:52px;object-fit:contain}
  .pmini small{display:block;font-size:11px;color:#d1fae5;margin-top:4px}
  .pmini b{display:block;font-size:12px;color:var(--gold)}
  button.gold{background:var(--gold);color:#071B17}
  .contest{background:linear-gradient(135deg,#065f46,#10B981);border-radius:24px;padding:20px;margin:6px 0 18px;box-shadow:0 10px 40px rgba(16,185,129,.3)}
  .ctitle{font-size:22px;font-weight:800}
  .cd{display:flex;gap:8px}
  .cd div{flex:1;background:rgba(7,27,23,.45);border-radius:14px;padding:10px 4px;text-align:center}
  .cd b{display:block;font-size:24px;color:var(--gold)}
  .cd small{font-size:11px;color:#d1fae5}
  .prize{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .prize:last-child{border:0}
  .prize{gap:14px;justify-content:flex-start}
  .prize .pr{color:var(--gold);font-weight:800;font-size:17px}
  .pimg{width:64px;height:64px;object-fit:contain;flex:none}
  header,main{max-width:500px;margin-left:auto;margin-right:auto}
  .langmenu{z-index:110}
  #toast{z-index:120;position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:12px;
    font-size:14px;display:none;max-width:90%;text-align:center}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:10px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="34" height="34" style="flex:none">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A23"/><stop offset="1" stop-color="#071B17"/>
    </linearGradient>

  const res = await fetch(`${CONFIG.SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json", apikey:CONFIG.SUPABASE_ANON_KEY, Authorization:"Bearer " + CONFIG.SUPABASE_ANON_KEY },
    body: JSON.stringify(args)
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.message || ("API " + res.status));
  return j;
}
async function api(action, data={}){
  if (TEST) return localApi(action, data);
  const init_data = tg?.initData || "";
  if (action === "init")          return rpc("app_init",     { init_data, start_param: startParam });
  if (action === "complete_task") return rpc("app_task",     { init_data, task_id: data.taskId });
  if (action === "join")          return rpc("app_join",     { init_data, channel: data.channel });
  if (action === "withdraw")      return rpc("app_withdraw", { init_data, amount: data.amount, method: data.method, account: data.phone, wid: data.wid });
  return {};
}
// TEST mode: keeps data on this device only
function localApi(action, data){
  const s = store.get("state", state);
  if (CONFIG.DEMO_TEST && action === "init"){ s.balance = Math.max(s.balance, 500); s.total = Math.max(s.total, 500); s.refs = Math.max(s.refs, 10); store.set("state", s); }
  if (action === "complete_task"){
    const task = CONFIG.TASKS.find(x => x.id === data.taskId);
    s.completed[task.id] = Date.now(); s.balance += task.reward; s.total += task.reward;
  }
  if (action === "withdraw"){
    s.balance -= data.amount;
    s.withdrawals.unshift({ wid:data.wid, amount:data.amount, method:data.method, status:"pending", date:Date.now() });
  }
  if (action === "leaderboard") return { list: [{ name: t("you"), refs: s.refs }] };
  store.set("state", s);
  return { user: s };
}

/* ---- render ---- */
function taskTitle(task){
  if (task.title && typeof task.title === "object") return task.title[lang] || task.title.en || "";
  if (task.title) return task.title;
  return task.type === "adsgram" ? t("taskAd") : t("taskLink");
}
function leftHours(task){
  const last = state.completed[task.id]; if (!last) return 0;
  if (task.once) return Infinity;   // one time only, forever
  const ms = last + task.cooldownHours*3600e3 - Date.now();
  return ms > 0 ? Math.ceil(ms/3600e3) : 0;
}
function taskCard(task, i){
  const h = leftHours(task);
  const div = document.createElement("div");
  div.className = "task" + (h ? " done" : "");
  div.innerHTML = `<div class="sub" style="margin:0">#${i+1}</div>
    <div class="t">${taskTitle(task)}</div>
    <div class="r">+${task.reward} ${CONFIG.CURRENCY}</div>`;
  const b = document.createElement("button");
  b.textContent = h === Infinity ? "✓ " + t("done") : h ? t("again",{h}) : t("start");
  b.disabled = !!h;
  b.onclick = () => runTask(task, b);
  div.appendChild(b);
  return div;
}

  $("allTasks").replaceChildren(...tasks.map(taskCard));

  $("prizeList").innerHTML = CONFIG.CONTEST.PRIZES.map(p=>`<div class="prize">
      <img src="${IMG[p.img]||""}" alt="" class="pimg">

  $("myInvites").textContent = state.refs;

  $("cDates").textContent = `${fmt(CONFIG.CONTEST.START)} – ${fmt(CONFIG.CONTEST.END)}`;
  tick();
  $("minNote").textContent = t("minWithdraw",{ m:CONFIG.MIN_WITHDRAW, c:CONFIG.CURRENCY });
  $("invRule").textContent = "🔓 " + t("needInvites",{ n:CONFIG.MIN_INVITES_TO_WITHDRAW, c:Math.min(state.refs, CONFIG.MIN_INVITES_TO_WITHDRAW) });
  $("methods").replaceChildren(...CONFIG.METHODS.map(m => {
    const b = document.createElement("button");
    b.className = "mth" + (m.name === method ? " sel" : "");
    const badge = m.logo ? `<img src="${m.logo}" alt="">` : `<span class="mbadge" style="background:${m.color}">${m.abbr}</span>`;

  $("mWarn").style.display = cm.disabled ? "block" : "none";

        <span class="badge ${w.status==="paid"?"paid":""}">${t(w.status==="paid"?"paid":"pending")}</span></div>`).join("")
    : `<div class="empty">${t("noData")}</div>`;

const refLink = () => `https://t.me/${CONFIG.BOT_USERNAME}/${CONFIG.MINI_APP_SHORT_NAME}?startapp=ref_${tgUser.id}`;

  try{

/* ---- contest countdown ---- */
function tick(){
  const now = Date.now(), st = Date.parse(CONFIG.CONTEST.START), en = Date.parse(CONFIG.CONTEST.END);
  const target = now < st ? st : en;
  const lbl = now > en ? t("ended") : now < st ? t("startsIn") : t("endsIn");
  ["cdLabel","cdLabel2"].forEach(id => $(id).textContent = lbl);
  if (now > en){ ["countdown","countdown2"].forEach(id => $(id).innerHTML = ""); return; }
  let x = Math.max(0, Math.floor((target - now)/1000));
  const parts = [[Math.floor(x/86400),"dd"],[Math.floor(x%86400/3600),"hh"],[Math.floor(x%3600/60),"mm"],[x%60,"ss"]];
  const html = parts.map(([v,k])=>`<div><b>${String(v).padStart(2,"0")}</b><small>${t(k)}</small></div>`).join("");
  $("countdown").innerHTML = $("countdown2").innerHTML = html;
}
setInterval(tick, 1000);

/* ---- tasks ---- */
async function reward(task){
  const r = await api("complete_task", { taskId: task.id });
  if (r.user) state = r.user;
  tg?.HapticFeedback?.notificationOccurred("success");
  toast(t("rewarded",{ r:task.reward, c:CONFIG.CURRENCY }));
  render();
}
function runTask(task, btn){
  if (task.type === "adsgram"){
    if (!window.Adsgram || !CONFIG.ADSGRAM_BLOCK_ID){ toast(t("adNotReady")); return; }
    const ad = window.Adsgram.init({ blockId: CONFIG.ADSGRAM_BLOCK_ID });
    // In production the reward should come from AdsGram's server "reward URL" to your backend.
    ad.show().then(r => { if (r.done) reward(task); }).catch(() => toast(t("adNotReady")));
    return;
  }
  // link task: open link, user must stay away for task.seconds
  const opened = Date.now();
  toast(t("stay",{ s:task.seconds }));
  tg?.openLink ? tg.openLink(task.url) : window.open(task.url, "_blank");
  btn.disabled = true;
  let left = task.seconds;
  btn.textContent = t("wait",{ s:left });
  const iv = setInterval(() => {
    left = Math.max(0, task.seconds - Math.floor((Date.now()-opened)/1000));
    btn.textContent = t("wait",{ s:left });
    if (left <= 0){ clearInterval(iv); reward(task).catch(()=>{ toast(t("adNotReady")); render(); }); }
  }, 1000);
}

/* ---- events ---- */
document.querySelectorAll("nav a").forEach(a => a.onclick = e => {
  e.preventDefault();
  document.querySelectorAll("nav a").forEach(x => x.classList.toggle("active", x===a));
  const links = [...document.querySelectorAll("nav a")];
  const from = links.findIndex(x => x.dataset.cur), to = links.indexOf(a);
  links.forEach(x => delete x.dataset.cur); a.dataset.cur = "1";
  const next = $("p-"+a.dataset.p), cur = document.querySelector(".page.active");
  if (cur === next) return;
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active","in-r","in-l"));
  next.classList.add("active", to >= from ? "in-r" : "in-l");
  window.scrollTo({ top:0, behavior:"smooth" });
  if (a.dataset.p === "withdraw") checkWithdrawStatus();
});
$("langBtn").onclick = e => { e.stopPropagation(); $("langMenu").classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest(".langwrap")) $("langMenu").classList.remove("open"); });
$("btnPromoInvite").onclick = () => document.querySelector('nav a[data-p="invite"]').click();
$("btnPromoSee").onclick = () => document.querySelector('nav a[data-p="top"]').click();

$("btnCopy").onclick = async () => {

  }
  toast(t("copied"));
};
$("btnShare").onclick = () => {

  tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank");
};
$("btnWithdraw").onclick = async () => {
  const phone = $("wPhone").value.trim(), amount = parseInt($("wAmount").value, 10) || 0;
  if (curMethod().disabled) return toast("⚠️ " + t("mpesaOff"));
  if (!new RegExp(curMethod().re).test(phone)) return toast(t("invalidPhone") + ": " + curMethod().ph);
  if (amount < CONFIG.MIN_WITHDRAW) return toast(t("minWithdraw",{ m:CONFIG.MIN_WITHDRAW, c:CONFIG.CURRENCY }));
  if (amount > state.balance) return toast(t("notEnough"));
  if (CONFIG.CHANNELS.some(c => !(state.joined||{})[c.id])) return showModal("join", t("needJoin"), CONFIG.CHANNELS.map(c => `${(state.joined||{})[c.id] ? "✅" : "⬜"} ${c.name}`).join("<br>"));
  if (state.refs < CONFIG.MIN_INVITES_TO_WITHDRAW) return showModal("invite", t("noInv",{ n:CONFIG.MIN_INVITES_TO_WITHDRAW }), `${t("yourInvites")}: <b style="color:var(--gold)">${state.refs} / ${CONFIG.MIN_INVITES_TO_WITHDRAW}</b>`);
  try{
    const before = state.balance;
    const wid = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const r = await api("withdraw", { amount, method, phone, wid });
    if (CONFIG.WITHDRAW_WEBHOOK){
      const u = tgUser || {};
      const body = new URLSearchParams({ action:"withdraw", wid, tg_id: String(u.id||""), tg_username: u.username||"", tg_name: [u.first_name,u.last_name].filter(Boolean).join(" "),
        amount: String(amount), method, account: phone, balance: String(before), refs: String(state.refs) });
      fetch(CONFIG.WITHDRAW_WEBHOOK, { method:"POST", mode:"no-cors", body }).catch(()=>{});
    }
    if (r.user) state = r.user;
    $("wAmount").value = ""; render();
    showModal("ok", t("wdOk"), `<b style="font-size:22px;color:var(--gold)">${amount} ${CONFIG.CURRENCY}</b> · ${method}<br><br>${t("wdOkSub")}`);
    tg?.HapticFeedback?.notificationOccurred("success");
  }catch(e){ toast("⚠️ " + e.message); }
};

/* ---- channel join (+5 B-Token, verified by the bot) ---- */
function saveLocal(){ if (TEST){ const s = store.get("state", state); Object.assign(s, { tokens:state.tokens, joined:state.joined }); store.set("state", s); } }
async function joinChannel(i, btn){
  const c = CONFIG.CHANNELS[i]; state.joined = state.joined || {};
  if (state.joined[c.id] !== false){            // first tap: open the channel
    tg?.openTelegramLink ? tg.openTelegramLink(c.url) : window.open(c.url, "_blank");
    state.joined[c.id] = false; saveLocal(); render(); return;
  }
  btn.disabled = true; btn.textContent = "…";
  let status = "";
  try{
    const res = await fetch(CONFIG.WITHDRAW_WEBHOOK, { method:"POST", body:new URLSearchParams({ action:"checkjoin", channel:c.id, tg_id:String(tgUser.id||"") }) });
    status = (await res.text()).trim();
  }catch(e){}
  if (["member","administrator","creator"].includes(status)){
    if (TEST){ state.joined[c.id] = true; state.tokens = (state.tokens||0) + CONFIG.JOIN_TOKENS; saveLocal(); }
    else { try{ const r = await api("join", { channel:c.id }); if (r.user) state = r.user; }catch(e){ toast(e.message); } }
    tg?.HapticFeedback?.notificationOccurred("success");
    toast(`+${CONFIG.JOIN_TOKENS} ${CONFIG.TOKEN_NAME} 🪙`);
  } else {
    toast(t("notJoined"));
    btn.textContent = t("notJoined"); btn.className = "chbtn ghost";
    setTimeout(() => { if (!state.joined[c.id]) { delete state.joined[c.id]; saveLocal(); render(); } }, 5000);
    return;
  }
  render();
}

/* ---- withdraw status (pending -> successful) ---- */
async function checkWithdrawStatus(){
  if (!TEST){ try{ const r = await api("init"); if (r.user){ state = r.user; render(); } }catch(e){} return; }
  if (!CONFIG.WITHDRAW_WEBHOOK) return;
  const pend = (state.withdrawals||[]).filter(w => w.status === "pending" && w.wid);
  let changed = false;
  for (const w of pend){
    try{
      const res = await fetch(CONFIG.WITHDRAW_WEBHOOK, { method:"POST", body:new URLSearchParams({ action:"status", wid:w.wid }) });
      const txt = (await res.text()).trim();
      if (txt === "paid"){ w.status = "paid"; changed = true; }
    }catch(e){}
  }
  if (changed){
    if (TEST){ const s = store.get("state", state); s.withdrawals = state.withdrawals; store.set("state", s); }
    render(); tg?.HapticFeedback?.notificationOccurred("success");
  }
}

/* ---- modal ---- */
function showModal(kind, title, html){
  const ok = kind === "ok";
  const icon = ok
    ? `<svg viewBox="0 0 120 120" class="mk"><circle class="mk-c" cx="60" cy="60" r="52"/><path class="mk-p" d="M36 62 l16 16 l32 -36"/></svg>`
    : `<div class="mk-inv">${kind === "join" ? "📢" : "👥"}</div>`;
  const coins = ok ? Array.from({length:14},(_,i)=>`<span class="coin-f" style="left:${5+i*6.5}%;animation-delay:${(i%5)*0.12}s;animation-duration:${1.6+(i%4)*0.35}s">🪙</span>`).join("") : "";
  $("modalBox").innerHTML = `${coins}${icon}<h3>${title}</h3><p>${html}</p>
    <div class="row">${ok ? "" : `<button class="gold" id="mInvite">${kind === "join" ? t("goJoin") : t("inviteNow")}</button>`}<button id="mClose" ${ok?"":'class="ghost"'}>${t("ok")}</button></div>`;
  $("modal").classList.add("open");
  $("mClose").onclick = () => $("modal").classList.remove("open");
  if (!ok) $("mInvite").onclick = () => { $("modal").classList.remove("open"); document.querySelector(`nav a[data-p="${kind === "join" ? "earn" : "invite"}"]`).click(); };
}

/* ---- start ---- */
render();
(async () => {
  try{ const r = await api("init"); if (r.user) state = r.user; }catch(e){}
  render();
  checkWithdrawStatus();
})();
